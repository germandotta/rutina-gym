<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Entreno">
    <link rel="apple-touch-icon" href="config/icon-192.png">
    <link rel="manifest" href="config/manifest.json">
    <title>Entreno v01</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1c1c1e;
            height: 100vh;
            color: #e0e0e0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .container { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* HEADER */
        .header {
            padding: 16px 20px 14px;
            background: #111113;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .header h1 { font-size: 22px; font-weight: 700; color: white; }

        .tabs { display: flex; gap: 8px; }

        .tab {
            flex: 1;
            padding: 9px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .tab.active {
            background: rgba(16,185,129,0.2);
            border-color: #10b981;
            color: #10b981;
        }

        /* LAYOUT EJERCICIO */
        #exerciseContainer {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        /* HEADER FIJO del ejercicio */
        .exercise-fixed {
            padding: 16px 20px 10px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .exercise-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .exercise-title-block { flex: 1; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        .exercise-name {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .btn-eye {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.6);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-eye.no-image { opacity: 0.2; pointer-events: none; }

        .exercise-specs { display: flex; gap: 6px; flex-wrap: wrap; }

        .spec {
            background: rgba(16,185,129,0.15);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            color: #10b981;
            border: 1px solid rgba(16,185,129,0.3);
        }

        /* TIMER */
        .timer-block {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 4px;
        }

        .timer-display {
            font-size: 22px;
            font-weight: 700;
            color: #10b981;
            font-variant-numeric: tabular-nums;
            min-width: 52px;
        }

        .timer-display.running { color: #f59e0b; }
        .timer-display.done { color: #10b981; }

        .timer-label { font-size: 11px; color: #666; flex: 1; }

        .btn-timer {
            background: rgba(16,185,129,0.15);
            border: 1px solid rgba(16,185,129,0.3);
            color: #10b981;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-timer.stop {
            background: rgba(239,68,68,0.15);
            border-color: rgba(239,68,68,0.3);
            color: #ef4444;
        }

        /* INSTRUCCIONES — scrolleables */
        .exercise-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 14px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .instructions {
            background: rgba(255,255,255,0.04);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .instructions h3 {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .instructions ul { list-style: none; padding: 0; }

        .instructions li {
            padding: 5px 0 5px 18px;
            position: relative;
            line-height: 1.35;
            color: #d0d0d0;
            font-size: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .instructions li:last-child { border-bottom: none; }

        .instructions li:before {
            content: "•";
            position: absolute;
            left: 4px;
            color: #10b981;
            font-weight: bold;
        }

        /* REGISTRO — colapsado */
        .registro-resumen {
            display: flex;
            align-items: center;
            background: rgba(16,185,129,0.06);
            border: 1px solid rgba(16,185,129,0.2);
            border-radius: 8px;
            padding: 9px 12px;
            gap: 8px;
        }

        .registro-resumen-texto { font-size: 12px; color: #666; flex: 1; }
        .registro-resumen-valor { font-size: 13px; font-weight: 700; color: #10b981; }

        .btn-editar-registro {
            font-size: 11px;
            font-weight: 600;
            color: #10b981;
            background: rgba(16,185,129,0.15);
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: 5px;
            padding: 4px 10px;
            cursor: pointer;
        }

        .btn-borrar-registro {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 15px;
            cursor: pointer;
            padding: 0 2px;
            opacity: 0.8;
        }

        /* NAVEGACIÓN */
        .navigation { display: flex; gap: 6px; }

        .btn {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-complete {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: #888;
            font-size: 13px;
            font-weight: 600;
            padding: 11px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-complete.done {
            background: rgba(16,185,129,0.15);
            border-color: rgba(16,185,129,0.4);
            color: #10b981;
        }

        .btn-next { background: #3b82f6; color: white; }
        .btn-next:active { transform: scale(0.97); }
        .btn-prev { background: rgba(255,255,255,0.1); color: #e0e0e0; border: 1px solid rgba(255,255,255,0.2); }
        .btn-prev:active { transform: scale(0.97); }

        /* LIGHTBOX */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .lightbox.open { display: flex; }

        .lightbox img {
            max-width: 92vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-emoji { font-size: 100px; }

        .lightbox-close {
            margin-top: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 28px;
            border-radius: 8px;
            cursor: pointer;
        }

        .lightbox-name {
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            margin-bottom: 16px;
        }

        /* MODAL REGISTRO */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.open { display: flex; }

        .modal-sheet {
            background: #222;
            border-radius: 16px 16px 0 0;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-title { font-size: 14px; font-weight: 700; color: #fff; }
        .modal-subtitle { font-size: 11px; color: #555; margin-top: -8px; }

        .modal-inputs { display: flex; gap: 10px; }

        .modal-field {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .modal-field label {
            font-size: 10px;
            color: #777;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-field input {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            padding: 10px 12px;
            width: 100%;
            -webkit-appearance: none;
        }

        .modal-field input:focus {
            outline: none;
            border-color: #10b981;
            background: rgba(16,185,129,0.08);
        }

        .modal-actions { display: flex; gap: 8px; }

        .btn-modal-guardar {
            flex: 1;
            background: #10b981;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 700;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-modal-cancelar {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #aaa;
            font-size: 14px;
            font-weight: 600;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* INSTRUCCIONES COLAPSABLES */
        .instructions-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .instructions-toggle {
            font-size: 11px;
            color: #555;
            font-weight: 600;
        }

        .instructions-body {
            display: none;
            margin-top: 8px;
        }

        .instructions-body.open { display: block; }

        /* HISTÓRICO */
        .historico-titulo {
            font-size: 10px;
            font-weight: 700;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .historico-lista { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }

        .historico-item {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #555;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .historico-item:last-child { border-bottom: none; }
        .historico-item .h-valor { color: #777; font-weight: 600; }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-title">
            <svg width="32" height="22" viewBox="0 0 334 227" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M315.738 83.9437V33.6291H275.711V0H213.012V81.7531H121.031V0H58.3179V33.6291H18.2913V83.9437C18.2913 94.0269 10.0958 102.187 0 102.187V124.813C10.1099 124.813 18.2913 132.987 18.2913 143.056V193.371H58.3179V227H121.017V145.247H212.983V227H275.682V193.371H315.709V143.056C315.709 132.973 323.904 124.813 334 124.813V102.187C323.89 102.187 315.709 94.0128 315.709 83.9437H315.738ZM58.3143 170.758H40.9733V56.2377H58.3143V170.758ZM98.3264 81.7498V204.372H80.9996V22.6235H98.3264V81.7498ZM203.832 122.619H130.171C125.124 122.619 121.012 118.532 121.012 113.484C121.012 108.435 125.109 104.348 130.171 104.348H203.832C208.88 104.348 212.992 108.435 212.992 113.484C212.992 118.532 208.894 122.619 203.832 122.619ZM253.006 33.611V204.358H235.679V22.6235H253.006V33.6258V33.611ZM293.033 170.743H275.692L275.706 56.2377H293.047V170.743H293.033Z" fill="#10B981"/>
            </svg>
            <h1>Entreno</h1>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="switchDay('lunes', this)">Lunes</div>
            <div class="tab" onclick="switchDay('miercoles', this)">Miércoles</div>
            <div class="tab" onclick="switchDay('viernes', this)">Viernes</div>
        </div>
    </div>

    <div id="exerciseContainer"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-name" id="lightboxName"></div>
    <img id="lightboxImg" src="" alt="" onerror="this.style.display='none'; document.getElementById('lightboxEmoji').style.display='block'">
    <div class="lightbox-emoji" id="lightboxEmoji" style="display:none"></div>
    <button class="lightbox-close" onclick="closeLightbox()">Cerrar</button>
</div>

<!-- MODAL REGISTRO -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet">
        <div>
            <div class="modal-title" id="modalTitle">Registrar carga</div>
            <div class="modal-subtitle" id="modalSubtitle"></div>
        </div>
        <div class="modal-inputs">
            <div class="modal-field">
                <label id="modalCargaLabel">Carga</label>
                <input type="number" id="modalCarga" placeholder="—" inputmode="decimal" step="0.5">
            </div>
            <div class="modal-field">
                <label>Reps</label>
                <input type="number" id="modalReps" placeholder="—" inputmode="numeric">
            </div>
        </div>
        <div id="modalHistorico"></div>
        <div class="modal-actions">
            <button class="btn-modal-guardar" onclick="guardarDesdeModal()">Guardar</button>
            <button class="btn-modal-cancelar" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>
</div>

// ── ESTADO ─────────────────────────────────────────────────────────────────────
let currentDay = 'lunes';
let exercises = dayData[currentDay].exercises;
let currentExercise = 0;
let completedExercises = new Set();
let timerInterval = null;
let timerSec = 0;
let timerRunning = false;
let timerMode = 'exercise'; // 'exercise' | 'rest'
let activeExerciseId = null;

// ── STORAGE ────────────────────────────────────────────────────────────────────
function historyKey(id) { return `entreno_hist_${id}`; }

function getHistory(id) {
    try { return JSON.parse(localStorage.getItem(historyKey(id))) || []; } catch(e) { return []; }
}

function addRecord(id, carga, reps) {
    const hist = getHistory(id);
    const record = {
        carga, reps,
        fecha: new Date().toLocaleDateString('es-UY', { day: '2-digit', month: '2-digit', year: '2-digit' }),
        hora: new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' })
    };
    hist.unshift(record);
    if (hist.length > 10) hist.pop();
    try { localStorage.setItem(historyKey(id), JSON.stringify(hist)); } catch(e) {}
    return record;
}

function deleteHistory(id) {
    try { localStorage.removeItem(historyKey(id)); } catch(e) {}
}

// ── TIMER ──────────────────────────────────────────────────────────────────────
function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${String(sec).padStart(2,'0')}`;
}

function startTimer(segundos, mode) {
    stopTimer();
    timerSec = segundos;
    timerRunning = true;
    timerMode = mode;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
        timerSec--;
        updateTimerDisplay();
        if (timerSec <= 0) {
            stopTimer();
            const el = document.getElementById('timerDisplay');
            if (el) { el.classList.remove('running'); el.classList.add('done'); el.textContent = '✓'; }
        }
    }, 1000);
}

function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    timerRunning = false;
}

function updateTimerDisplay() {
    const el = document.getElementById('timerDisplay');
    if (el) {
        el.textContent = formatTime(timerSec);
        el.classList.toggle('running', timerRunning);
        el.classList.remove('done');
    }
}

function toggleTimer(segundos, mode) {
    if (timerRunning) {
        stopTimer();
        updateTimerDisplay();
        const btn = document.getElementById('timerBtn');
        if (btn) { btn.textContent = 'Iniciar'; btn.classList.remove('stop'); }
    } else {
        startTimer(segundos, mode);
        const btn = document.getElementById('timerBtn');
        if (btn) { btn.textContent = 'Detener'; btn.classList.add('stop'); }
    }
}

const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbz0Ao_TIHg94zk4v1ewUMyGl1vBxAwzSw8yozIwIdmiNyVaYRBBX9KPgJuSpHgGjYvZ/exec';

function enviarASheets(exerciseId, carga, reps, record) {
    const ex = exercises.find(e => e.id === exerciseId);
    fetch(SHEETS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            fecha: record.fecha,
            hora: record.hora,
            dia: currentDay,
            ejercicio: ex ? ex.name : exerciseId,
            carga: carga,
            reps: reps
        })
    }).catch(() => {});
}

// ── MODAL REGISTRO ─────────────────────────────────────────────────────────────
function abrirModal(exerciseId) {
    activeExerciseId = exerciseId;
    const ex = exercises.find(e => e.id === exerciseId);
    document.getElementById('modalTitle').textContent = ex.name;
    document.getElementById('modalCargaLabel').textContent = ex.loadLabel || 'Carga';

    const hist = getHistory(exerciseId);
    const subtitle = hist.length > 0
        ? `Última vez: ${hist[0].carga} · ${hist[0].reps} reps — ${hist[0].fecha}`
        : 'Sin registros previos';
    document.getElementById('modalSubtitle').textContent = subtitle;

    // Histórico
    let histHTML = '';
    if (hist.length > 1) {
        histHTML = `<div class="historico-titulo">Histórico</div><div class="historico-lista">`;
        hist.slice(1).forEach(r => {
            histHTML += `<div class="historico-item"><span>${r.fecha} ${r.hora}</span><span class="h-valor">${r.carga} · ${r.reps} reps</span></div>`;
        });
        histHTML += `</div>`;
    }
    document.getElementById('modalHistorico').innerHTML = histHTML;

    document.getElementById('modalCarga').value = '';
    document.getElementById('modalReps').value = '';
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('modalCarga').focus(), 100);
}

function cerrarModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    activeExerciseId = null;
}

function guardarDesdeModal() {
    const carga = document.getElementById('modalCarga').value;
    const reps = document.getElementById('modalReps').value;
    if (!carga && !reps) { cerrarModal(); return; }
    const record = addRecord(activeExerciseId, carga || '—', reps || '—');
    enviarASheets(activeExerciseId, carga || '—', reps || '—', record);
    cerrarModal();
    renderRegistroResumen(activeExerciseId);
}

function renderRegistroResumen(exerciseId) {
    const el = document.getElementById(`registro_${exerciseId}`);
    if (!el) return;
    const hist = getHistory(exerciseId);
    const last = hist[0];
    el.innerHTML = last
        ? `<span class="registro-resumen-texto">Última vez</span><span class="registro-resumen-valor">${last.carga} · ${last.reps} reps</span><div style="display:flex;gap:6px;align-items:center"><button class="btn-editar-registro" onclick="abrirModal('${exerciseId}')">Editar</button><button class="btn-borrar-registro" onclick="borrarRegistro('${exerciseId}')">✕</button></div>`
        : `<span class="registro-resumen-texto" style="color:#555">Sin registros</span><button class="btn-editar-registro" onclick="abrirModal('${exerciseId}')">+ Registrar</button>`;
}

function borrarRegistro(exerciseId) {
    deleteHistory(exerciseId);
    renderRegistroResumen(exerciseId);
}

// ── RENDER ─────────────────────────────────────────────────────────────────────

                <div class="navigation">
                    ${index > 0 ? '<button class="btn btn-prev" onclick="prevExercise()">← Anterior</button>' : ''}
                    ${index < exercises.length - 1
                        ? '<button class="btn btn-next" onclick="nextExercise()">Siguiente →</button>'
                        : '<button class="btn btn-next" onclick="finishWorkout()">Finalizar ✓</button>'}
                </div>
            </div>
        </div>`;

    document.getElementById('exerciseContainer').innerHTML = html;
}

let restInterval = null;
function toggleRestTimer(segundos) {
    const btn = document.getElementById('restBtn');
    const display = document.getElementById('restDisplay');
    if (restInterval) {
        clearInterval(restInterval);
        restInterval = null;
        if (btn) { btn.textContent = 'Iniciar'; btn.classList.remove('stop'); }
        return;
    }
    let s = segundos;
    display.classList.add('running');
    if (btn) { btn.textContent = 'Detener'; btn.classList.add('stop'); }
    restInterval = setInterval(() => {
        s--;
        if (display) display.textContent = formatTime(s);
        if (s <= 0) {
            clearInterval(restInterval); restInterval = null;
            if (display) { display.classList.remove('running'); display.classList.add('done'); display.textContent = '✓'; }
            if (btn) { btn.textContent = 'Iniciar'; btn.classList.remove('stop'); }
        }
    }, 1000);
}

function toggleInstrucciones(header) {
    const body = header.nextElementSibling;
    const toggle = header.querySelector('.instructions-toggle');
    const open = body.classList.toggle('open');
    toggle.textContent = open ? 'Ocultar ▴' : 'Ver ▾';
}

function toggleComplete(exerciseId, exerciseName) {
    const wasCompleted = completedExercises.has(exerciseId);
    if (wasCompleted) {
        completedExercises.delete(exerciseId);
    } else {
        completedExercises.add(exerciseId);
        // Enviar a Sheets
        const now = new Date();
        const fecha = now.toLocaleDateString('es-UY', { day: '2-digit', month: '2-digit', year: '2-digit' });
        const hora = now.toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
        fetch(SHEETS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                fecha, hora,
                dia: currentDay,
                ejercicio: exerciseName,
                carga: '—',
                reps: '—',
                completado: 'sí'
            })
        }).catch(() => {});
    }
    renderExercise(currentExercise);
}

// ── LIGHTBOX ──────────────────────────────────────────────────────────────────
function openLightbox(imgSrc, name, emoji) {
    const lb = document.getElementById('lightbox');
    const img = document.getElementById('lightboxImg');
    const emojiEl = document.getElementById('lightboxEmoji');
    document.getElementById('lightboxName').textContent = name;
    img.style.display = 'block';
    emojiEl.style.display = 'none';
    img.src = imgSrc;
    emojiEl.textContent = emoji;
    lb.classList.add('open');
}

function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

// ── NAVEGACIÓN ────────────────────────────────────────────────────────────────
function switchDay(day, el) {
    currentDay = day;
    exercises = dayData[day].exercises;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentExercise = 0;
    completedExercises.clear();
    exercises.length > 0 ? renderExercise(0) : document.getElementById('exerciseContainer').innerHTML = '<div class="empty-state">Rutina próximamente</div>';
}

function nextExercise() {
    if (currentExercise < exercises.length - 1) {
        currentExercise++;
        renderExercise(currentExercise);
        document.querySelector('.exercise-scroll')?.scrollTo(0, 0);
    }
}

function prevExercise() {
    if (currentExercise > 0) {
        currentExercise--;
        renderExercise(currentExercise);
        document.querySelector('.exercise-scroll')?.scrollTo(0, 0);
    }
}

function finishWorkout() {
    if (confirm('¿Reiniciar la rutina?')) { currentExercise = 0; renderExercise(0); }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderExercise(0);

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('config/service-worker.js')
        .then(() => console.log('SW registered'))
        .catch(err => console.log('SW error:', err));
}
</script>
</body>
</html>
