<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Entreno">
    <link rel="apple-touch-icon" href="config/icon-192.png">
    <link rel="manifest" href="config/manifest.json">
    <title>Entreno v02</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1c1c1e;
            height: 100vh;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            padding: 16px 20px 14px;
            background: #111113;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .header h1 { font-size: 22px; font-weight: 700; color: white; }

        .tabs { display: flex; gap: 8px; }

        .tab {
            flex: 1;
            padding: 9px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .tab.active {
            background: rgba(16,185,129,0.2);
            border-color: #10b981;
            color: #10b981;
        }

        /* LISTA */
        .exercise-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 24px;
        }

        /* SECCIÓN */
        .section-header {
            font-size: 10px;
            font-weight: 700;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 16px 4px 6px;
        }

        .section-header:first-child { padding-top: 4px; }

        /* CARD */
        .ex-card {
            background: #242426;
            border-radius: 10px;
            margin-bottom: 6px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            transition: border-color 0.2s;
        }

        .ex-card.completed { border-color: rgba(16,185,129,0.3); }
        .ex-card.expanded { border-color: rgba(255,255,255,0.12); }

        /* FILA COLAPSADA */
        .ex-row {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .ex-num {
            font-size: 11px;
            font-weight: 700;
            color: #444;
            min-width: 18px;
        }

        .ex-info { flex: 1; min-width: 0; }

        .ex-name {
            font-size: 15px;
            font-weight: 600;
            color: #e8e8e8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ex-card.completed .ex-name { color: #888; }

        .ex-meta {
            font-size: 12px;
            color: #555;
            margin-top: 2px;
        }

        .ex-meta .last-load {
            color: #10b981;
            font-weight: 600;
        }

        /* CHECKBOX */
        .ex-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }

        .ex-check.done {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }

        /* CHEVRON */
        .ex-chevron {
            font-size: 11px;
            color: #444;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .ex-card.expanded .ex-chevron { transform: rotate(180deg); }

        /* EXPANDIDO */
        .ex-body {
            display: none;
            padding: 0 14px 14px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .ex-card.expanded .ex-body { display: flex; }

        /* SPECS */
        .ex-specs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding-top: 12px;
        }

        .spec {
            background: rgba(16,185,129,0.12);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            color: #10b981;
            border: 1px solid rgba(16,185,129,0.25);
        }



        /* REGISTRO */
        .registro-row {
            display: flex;
            align-items: center;
            background: rgba(16,185,129,0.06);
            border: 1px solid rgba(16,185,129,0.15);
            border-radius: 8px;
            padding: 8px 12px;
            gap: 8px;
        }

        .registro-label { font-size: 11px; color: #555; flex: 1; }
        .registro-valor { font-size: 13px; font-weight: 700; color: #10b981; }

        .btn-reg {
            font-size: 11px;
            font-weight: 600;
            color: #10b981;
            background: rgba(16,185,129,0.15);
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: 5px;
            padding: 4px 10px;
            cursor: pointer;
        }

        .btn-del {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 14px;
            cursor: pointer;
            opacity: 0.7;
        }

        /* BOTONES DE ACCIÓN */
        .action-row {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            font-weight: 600;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
        }


        /* INSTRUCCIONES INLINE */
        .instr-inline {
            display: none;
            list-style: none;
            flex-direction: column;
            gap: 12px;
            padding: 6px 4px 4px;
        }

        .instr-inline.open { display: flex; }

        .instr-inline li {
            font-size: 17px;
            line-height: 1.45;
            color: #ddd;
            position: relative;
            padding-left: 20px;
        }

        .instr-inline li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #10b981;
            font-weight: bold;
        }

        /* LIGHTBOX */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .lightbox.open { display: flex; }

        .lightbox img {
            max-width: 92vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-emoji { font-size: 100px; }

        .lightbox-close {
            margin-top: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 28px;
            border-radius: 8px;
            cursor: pointer;
        }

        .lightbox-name {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            margin-bottom: 16px;
        }

        /* MODAL REGISTRO */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.open { display: flex; }

        .modal-sheet {
            background: #222;
            border-radius: 16px 16px 0 0;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-title { font-size: 14px; font-weight: 700; color: #fff; }
        .modal-subtitle { font-size: 11px; color: #555; margin-top: -8px; }

        .modal-inputs { display: flex; gap: 10px; }

        .modal-field {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .modal-field label {
            font-size: 10px;
            color: #777;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-height: 26px;
            display: flex;
            align-items: flex-end;
        }

        .modal-field input {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            padding: 10px 12px;
            width: 100%;
            -webkit-appearance: none;
        }

        .modal-field input:focus {
            outline: none;
            border-color: #10b981;
            background: rgba(16,185,129,0.08);
        }

        .modal-actions { display: flex; gap: 8px; }

        .btn-modal-guardar {
            flex: 1;
            background: #10b981;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 700;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-modal-cancelar {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #aaa;
            font-size: 14px;
            font-weight: 600;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .historico-titulo {
            font-size: 10px;
            font-weight: 700;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .historico-lista { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }

        .historico-item {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #555;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .historico-item:last-child { border-bottom: none; }
        .historico-item .h-valor { color: #777; font-weight: 600; }
    </style>
</head>
<body>
<div class="container" style="display:flex;flex-direction:column;height:100vh;overflow:hidden">
    <div class="header">
        <div class="header-title">
            <svg width="32" height="22" viewBox="0 0 334 227" fill="none" xmlns="http://www.w3.org/2000/svg">

    <div class="exercise-list" id="exerciseList"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-name" id="lightboxName"></div>
    <div id="lightboxLoading" style="display:none; color:#555; font-size:13px;">Buscando imagen...</div>
    <img id="lightboxImg" src="" alt="" onerror="this.style.display='none'; document.getElementById('lightboxEmoji').style.display='block'">
    <div class="lightbox-emoji" id="lightboxEmoji" style="display:none"></div>
    <button class="lightbox-close" onclick="closeLightbox()">Cerrar</button>
</div>

<!-- MODAL REGISTRO -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet">
        <div>
            <div class="modal-title" id="modalTitle">Registrar carga</div>
            <div class="modal-subtitle" id="modalSubtitle"></div>
        </div>
        <div class="modal-inputs">
            <div class="modal-field" id="modalCargaField">
                <label id="modalCargaLabel">Carga</label>
                <input type="text" id="modalCarga" placeholder="—" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*">
            </div>
            <div class="modal-field">
                <label>Reps</label>
                <input type="number" id="modalReps" placeholder="—" inputmode="numeric">
            </div>
        </div>
        <div id="modalHistorico"></div>
        <div class="modal-actions">
            <button class="btn-modal-guardar" onclick="guardarDesdeModal()">Guardar</button>
            <button class="btn-modal-cancelar" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>
</div>

// ── ESTADO ─────────────────────────────────────────────────────────────────────
let currentDay = 'lunes';
let completedExercises = new Set();
let expandedExercises = new Set();
let activeExerciseId = null;

// ── STORAGE ────────────────────────────────────────────────────────────────────
function historyKey(id) { return `entreno_hist_${id}`; }

function getHistory(id) {
    try { return JSON.parse(localStorage.getItem(historyKey(id))) || []; } catch(e) { return []; }
}

function addRecord(id, carga, reps) {
    const hist = getHistory(id);
    const record = {
        carga, reps,
        fecha: new Date().toLocaleDateString('es-UY', { day: '2-digit', month: '2-digit', year: '2-digit' }),
        hora: new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' })
    };
    hist.unshift(record);
    if (hist.length > 10) hist.pop();
    try { localStorage.setItem(historyKey(id), JSON.stringify(hist)); } catch(e) {}
    return record;
}

function deleteHistory(id) {
    try { localStorage.removeItem(historyKey(id)); } catch(e) {}
}

// ── SHEETS ─────────────────────────────────────────────────────────────────────
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbz0Ao_TIHg94zk4v1ewUMyGl1vBxAwzSw8yozIwIdmiNyVaYRBBX9KPgJuSpHgGjYvZ/exec';

function enviarASheets(exerciseId, carga, reps, record) {
    const ex = dayData[currentDay].exercises.find(e => e.id === exerciseId);
    fetch(SHEETS_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fecha: record.fecha, hora: record.hora, dia: currentDay, ejercicio: ex ? ex.name : exerciseId, carga, reps, completado: '' })
    }).catch(() => {});
}

// ── HELPERS ────────────────────────────────────────────────────────────────────
function findExercise(exerciseId) {
    return dayData[currentDay].exercises.find(e => e.id === exerciseId);
}

function formatRecord(ex, r) {
    return ex.hasLoad ? `${r.carga} · ${r.reps} reps` : `${r.reps} reps`;
}

// ── MODAL ──────────────────────────────────────────────────────────────────────
function abrirModal(exerciseId) {
    activeExerciseId = exerciseId;
    const ex = findExercise(exerciseId);
    const hist = getHistory(exerciseId);
    const cargaField = document.getElementById('modalCargaField');
    document.getElementById('modalTitle').textContent = ex.name;

    if (ex.hasLoad) {
        cargaField.style.display = '';
        document.getElementById('modalCargaLabel').textContent = ex.loadLabel || 'Carga';
    } else {
        cargaField.style.display = 'none';
    }

    document.getElementById('modalSubtitle').textContent = hist.length > 0
        ? `Última vez: ${formatRecord(ex, hist[0])} — ${hist[0].fecha}`
        : 'Sin registros previos';
    let histHTML = '';
    if (hist.length > 1) {
        histHTML = `<div class="historico-titulo">Histórico</div><div class="historico-lista">`;
        hist.slice(1).forEach(r => {
            histHTML += `<div class="historico-item"><span>${r.fecha} ${r.hora}</span><span class="h-valor">${formatRecord(ex, r)}</span></div>`;
        });
        histHTML += `</div>`;
    }
    document.getElementById('modalHistorico').innerHTML = histHTML;
    document.getElementById('modalCarga').value = hist.length > 0 && hist[0].carga !== '—' ? hist[0].carga : '';
    document.getElementById('modalReps').value = hist.length > 0 && hist[0].reps !== '—' ? hist[0].reps : '';
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById(ex.hasLoad ? 'modalCarga' : 'modalReps').focus(), 100);
}

function cerrarModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    activeExerciseId = null;
}

function guardarDesdeModal() {
    const ex = findExercise(activeExerciseId);
    const carga = ex.hasLoad ? document.getElementById('modalCarga').value : '—';
    const reps = document.getElementById('modalReps').value;
    if ((!carga || carga === '—') && !reps) { cerrarModal(); return; }
    const id = activeExerciseId;
    const record = addRecord(id, carga || '—', reps || '—');
    enviarASheets(id, carga || '—', reps || '—', record);
    cerrarModal();
    renderRegistroResumen(id);
    renderCardMeta(id);
}

// ── RENDER REGISTRO ────────────────────────────────────────────────────────────
function renderRegistroResumen(exerciseId) {
    const el = document.getElementById(`registro_${exerciseId}`);
    if (!el) return;
    const ex = findExercise(exerciseId);
    const hist = getHistory(exerciseId);
    const last = hist[0];
    el.innerHTML = last
        ? `<span class="registro-label">Última vez</span><span class="registro-valor">${formatRecord(ex, last)}</span><div style="display:flex;gap:6px;align-items:center"><button class="btn-reg" onclick="abrirModal('${exerciseId}')">Editar</button><button class="btn-del" onclick="borrarRegistro('${exerciseId}')">✕</button></div>`
        : `<span class="registro-label" style="color:#444">Sin registros</span><button class="btn-reg" onclick="abrirModal('${exerciseId}')">+ Registrar</button>`;
}

function borrarRegistro(exerciseId) {
    deleteHistory(exerciseId);
    renderRegistroResumen(exerciseId);
    renderCardMeta(exerciseId);
}

function renderCardMeta(exerciseId) {
    const el = document.getElementById(`meta_${exerciseId}`);
    if (!el) return;
    const ex = findExercise(exerciseId);
    if (!ex) return;
    const hist = getHistory(exerciseId);
    const last = hist[0];
    const planStr = ex.sets !== '-' ? `${ex.sets} × ${ex.reps}` : ex.reps;
    el.innerHTML = (ex.hasLoad || ex.trackReps) && last
        ? `${planStr} <span class="last-load">· ${formatRecord(ex, last)}</span>`
        : planStr;
}

// ── TOGGLE EXPAND ──────────────────────────────────────────────────────────────
function toggleExpand(exerciseId) {
    const card = document.getElementById(`card_${exerciseId}`);
    if (!card) return;
    if (expandedExercises.has(exerciseId)) {
        expandedExercises.delete(exerciseId);
        card.classList.remove('expanded');
    } else {
        expandedExercises.add(exerciseId);
        card.classList.add('expanded');
    }
}

function toggleInstrucciones(exerciseId) {
    const body = document.getElementById(`instr_${exerciseId}`);
    if (!body) return;
    body.classList.toggle('open');
}

// ── COMPLETAR ──────────────────────────────────────────────────────────────────
function marcarCompleto(exerciseId, exerciseName, event) {
    event.stopPropagation();
    if (completedExercises.has(exerciseId)) return;
    completedExercises.add(exerciseId);
    const card = document.getElementById(`card_${exerciseId}`);
    const check = document.getElementById(`check_${exerciseId}`);
    if (card) card.classList.add('completed');
    if (check) { check.classList.add('done'); check.textContent = '✓'; }
    const now = new Date();
    const fecha = now.toLocaleDateString('es-UY', { day: '2-digit', month: '2-digit', year: '2-digit' });
    const hora = now.toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
    fetch(SHEETS_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fecha, hora, dia: currentDay, ejercicio: exerciseName, carga: '—', reps: '—', completado: 'sí' })
    }).catch(() => {});
}

// ── RENDER LISTA ───────────────────────────────────────────────────────────────
function renderList(day) {
    const data = dayData[day];
    const list = document.getElementById('exerciseList');
    let html = '';
    let currentSection = '';
    let num = 0;

    data.exercises.forEach(ex => {
        num++;
        const hasRegistro = ex.hasLoad || ex.trackReps;
        const hist = hasRegistro ? getHistory(ex.id) : [];
        const last = hist[0];
        const planStr = ex.sets !== '-' ? `${ex.sets} × ${ex.reps}` : ex.reps;
        const metaStr = hasRegistro && last
            ? `${planStr} <span class="last-load">· ${formatRecord(ex, last)}</span>`
            : planStr;
        const isCompleted = completedExercises.has(ex.id);
        const isExpanded = expandedExercises.has(ex.id);

        if (ex.section !== currentSection) {
            currentSection = ex.section;
            html += `<div class="section-header">${ex.section}</div>`;
        }

        // Registro HTML
        const registroHTML = hasRegistro ? `
            <div class="registro-row" id="registro_${ex.id}">
                ${last
                    ? `<span class="registro-label">Última vez</span><span class="registro-valor">${formatRecord(ex, last)}</span><div style="display:flex;gap:6px;align-items:center"><button class="btn-reg" onclick="abrirModal('${ex.id}')">Editar</button><button class="btn-del" onclick="borrarRegistro('${ex.id}')">✕</button></div>`
                    : `<span class="registro-label" style="color:#444">Sin registros</span><button class="btn-reg" onclick="abrirModal('${ex.id}')">+ Registrar</button>`
                }
            </div>` : '';

        // Specs
        const specsHTML = `<div class="ex-specs">
            ${ex.sets !== '-' ? `<div class="spec">Series: ${ex.sets}</div>` : ''}
            ${ex.reps !== '-' ? `<div class="spec">Reps: ${ex.reps}</div>` : ''}
            ${ex.rest !== '-' ? `<div class="spec">Descanso: ${ex.rest}</div>` : ''}
        </div>`;

        html += `
        <div class="ex-card ${isCompleted ? 'completed' : ''} ${isExpanded ? 'expanded' : ''}" id="card_${ex.id}">
            <div class="ex-row" onclick="toggleExpand('${ex.id}')">
                <span class="ex-num">${num}</span>
                <div class="ex-info">
                    <div class="ex-name">${ex.name}</div>
                    <div class="ex-meta" id="meta_${ex.id}">${metaStr}</div>
                </div>
                <div class="ex-check ${isCompleted ? 'done' : ''}" id="check_${ex.id}"
                    onclick="marcarCompleto('${ex.id}', '${ex.name.replace(/'/g,"\\'")}', event)">
                    ${isCompleted ? '✓' : ''}
                </div>
                <span class="ex-chevron">▼</span>
            </div>
            <div class="ex-body">
                ${specsHTML}
                <div class="action-row">
                    <button class="btn-action" onclick="toggleInstrucciones('${ex.id}')">📋 Instrucciones</button>
                    ${!ex.noImage ? `<button class="btn-action" onclick="openLightbox('', '${ex.name}', '${ex.emoji}')">👁 Imagen</button>` : ''}
                </div>
                <ul class="instr-inline" id="instr_${ex.id}">${ex.instructions.map(i => `<li>${i}</li>`).join('')}</ul>
                ${registroHTML}
            </div>
        </div>`;
    });

    list.innerHTML = html;
}

// ── SWITCH DAY ─────────────────────────────────────────────────────────────────
function switchDay(day, el) {
    currentDay = day;
    completedExercises.clear();
    expandedExercises.clear();
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderList(day);
}

const gifCache = {};

async function openLightbox(imgSrc, name, emoji) {
    const lb = document.getElementById('lightbox');
    const img = document.getElementById('lightboxImg');
    const emojiEl = document.getElementById('lightboxEmoji');
    const loading = document.getElementById('lightboxLoading');
    document.getElementById('lightboxName').textContent = name;
    img.style.display = 'none';
    emojiEl.style.display = 'none';
    loading.style.display = 'none';
    lb.classList.add('open');

    if (gifCache[name]) {
        img.style.display = 'block';
        img.src = gifCache[name];
        return;
    }

    const localPath = localImageMap[name];
    if (localPath) {
        const url = `${LOCAL_IMG_BASE}${localPath}`;
        gifCache[name] = url;
        img.style.display = 'block';
        img.src = url;
        return;
    }

    const imagePath = exerciseImageMap[name];
    if (imagePath) {
        const url = `${IMG_BASE}${imagePath}`;
        gifCache[name] = url;
        img.style.display = 'block';
        img.src = url;
    } else {
        emojiEl.textContent = emoji;
        emojiEl.style.display = 'block';
    }
}

function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

// ── INIT ───────────────────────────────────────────────────────────────────────

// Construir mapa nombre -> id para todos los ejercicios
const nameToId = {};
Object.values(dayData).forEach(day => {
    day.exercises.forEach(ex => { nameToId[ex.name] = ex.id; });
});

async function cargarDesdeSheets() {
    try {
        const res = await fetch(SHEETS_URL);
        const json = await res.json();
        if (!json.ok || !json.data) return;

        // Agrupar por ejercicio, ordenar por fecha/hora desc, guardar en localStorage
        const histMap = {};
        json.data.forEach(row => {
            const nombre = row['Ejercicio'];
            const carga = row['Carga'];
            const reps = row['Reps'];
            const completado = row['Completado'];
            if (!nombre || completado === 'sí') return;
            if (!carga && !reps) return;
            if (String(carga) === '—' && String(reps) === '—') return;
            const id = nameToId[nombre];
            if (!id) return;
            if (!histMap[id]) histMap[id] = [];
            histMap[id].push({
                carga: String(carga || '—'),
                reps: String(reps || '—'),
                fecha: String(row['Fecha'] ? new Date(row['Fecha']).toLocaleDateString('es-UY', { day: '2-digit', month: '2-digit', year: '2-digit' }) : ''),
                hora: String(row['Hora'] || '')
            });
        });

        // Guardar en localStorage (más reciente primero, máx 10)
        Object.entries(histMap).forEach(([id, records]) => {
            const sorted = records.reverse().slice(0, 10);
            try { localStorage.setItem(historyKey(id), JSON.stringify(sorted)); } catch(e) {}
        });
    } catch(e) {
        // Si falla, usa localStorage existente
    }
}

async function init() {
    renderList('lunes'); // render inmediato con localStorage
    await cargarDesdeSheets(); // actualiza en segundo plano
    renderList('lunes'); // re-render con datos del Sheet
}

init();

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('config/service-worker.js').catch(() => {});
}
